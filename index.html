<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="calculator_styles.css">
        <title>Calculator</title>
    </head>
    <body>
        <div class="container">
            <div class="calculator">
                <input type="text" id="display" readonly>
                <div class="buttons-grid">
                    <button class="calc-button operator" id="sqrt" value="sqrt">√</button>
                    <button class="calc-button operator" id="percent" value="%">%</button>
                    <button class="calc-button" id="clear" value="clear">C</button> 
                    <button class="calc-button operator" id="divide" value="/">/</button>

                    <button class="calc-button number" id="seven" value="7">7</button>
                    <button class="calc-button number" id="eight" value="8">8</button>
                    <button class="calc-button number" id="nine" value="9">9</button>
                    <button class="calc-button operator" id="multiply" value="*">*</button>

                    <button class="calc-button number" id="four" value="4">4</button>
                    <button class="calc-button number" id="five" value="5">5</button>
                    <button class="calc-button number" id="six" value="6">6</button>
                    <button class="calc-button operator" id="subtract" value="-">-</button>

                    <button class="calc-button number" id="one" value="1">1</button>
                    <button class="calc-button number" id="two" value="2">2</button>
                    <button class="calc-button number" id="three" value="3">3</button>
                    <button class="calc-button operator" id="add" value="+">+</button>

                    <button class="calc-button" id="clear-entry" value="clear-entry">CE</button>
                    <button class="calc-button number span-two" id="zero" value="0">0</button>
                    <button class="calc-button" id="decimal" value=".">.</button>
                    <button class="calc-button operator" id="equals" value="=">=</button>
                </div>
            </div>
        </div>
        <script src="calculator_logic.js"></script>
    </body>
</html>
